<div class="row align-items-start">
    <div class="col-md-12">
        <input [value]="placeholder" (input)="placeholder = $any($event.target).value">
    </div>
    <p>{{ placeholder }}</p>
</div>

<div class="row align-items-start">
    <div class="col-md-12">
        <input type="text" [(ngModel)]="placepass">
    </div>
    <p>{{ placepass }}</p>
</div>
